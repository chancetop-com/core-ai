# Admin user configuration (only used when no users exist)
# Azure Blob Storage for user file uploads
sys.admin.email=admin@example.com
sys.admin.name=Admin
sys.admin.password=admin
# refresh cadence for long-running tool calls (pending/poll); completion is pushed into the issuing session
sys.asyncTask.pollSeconds=10
sys.gateway.secret.key=change-me
sys.http.listen=8080
sys.https.listen=8443
sys.jedis.host=localhost
sys.jedis.port=6379
sys.log.appender=console
sys.mongo.uri=mongodb://localhost:27017/core-ai
sys.public.url=http://localhost:8080
sys.sandbox.provider=none
sys.sandbox.snapshot.enabled=false
sys.sandbox.terminal.enabled=false
sys.sandbox.terminal.gatewayUrl=
sys.sandbox.terminal.ticketSecret=
sys.session.host=local
