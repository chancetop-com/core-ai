# Admin user configuration (only used when no users exist)
# Azure Blob Storage for user file uploads
sys.admin.email=admin@example.com
sys.admin.name=Admin
sys.admin.password=admin
# refresh cadence for long-running tool calls (pending/poll); completion is pushed into the issuing session
sys.asyncTask.pollSeconds=10
# asynchronous command queue: redis (streams) | postgres (owner-pod queue); postgres requires sys.store.mode=pg
sys.command.backend=redis
# dataset record store: mongo (core-ng mapping, default) | mongo-native (native driver, data as BSON) | postgresql
# copies mongo datasets/records into postgresql on startup, only when the store is not postgresql
sys.dataset.migration.enabled=false
sys.dataset.mongoNativeCollection=dataset_records_v2
# optional read-only SQL executor (postgresql store only); disabled by default
sys.dataset.sqlExecutor.enabled=false
sys.dataset.sqlExecutor.password=
sys.dataset.sqlExecutor.user=dataset_reader
sys.dataset.store=mongo
# only used when sys.dataset.store=postgresql
sys.db.password=core_ai
sys.db.url=jdbc:postgresql://localhost:5432/core_ai
sys.db.user=core_ai
sys.gateway.secret.key=change-me
sys.http.listen=8080
sys.https.listen=8443
# Shared secret for pod-to-pod /_internal calls; required when sys.rpc.transport=http.
# Keep the previous value during a rotation so rolling pods accept both.
sys.internal.token=
sys.internal.token.previous=
sys.jedis.host=localhost
sys.jedis.port=6379
# pod registry and leases (session/run ownership, turn states, per-user session counts): redis | postgres
# postgres requires sys.store.mode=pg
sys.lease.backend=redis
sys.log.appender=console
sys.mongo.uri=mongodb://localhost:27017/core-ai
sys.public.url=http://localhost:8080
# conversational dataset reports: enabled only on the postgresql dataset backend
sys.report.enabled=false
# synchronous RPC between pods: redis (stream + pub/sub) | http (direct to the owner pod)
# http requires sys.store.mode=pg, messaging.pods (V40) and sys.internal.token; it keeps Redis
# as a fallback during the rolling upgrade
sys.rpc.transport=redis
# Cap for copying a chat attachment into the session's sandbox, in bytes; larger uploads arrive as URLs only
sys.sandbox.attachments.maxBytes=33554432
# docker provider: Docker Engine API endpoint (tcp://host:2375; a unix socket path falls back to localhost:2375) and the
# host directory sandboxes mount as /workspace. Declared here so SYS_SANDBOX_DOCKER_SOCKET / -D overrides apply —
# core-ng only overrides keys that exist in this file (the compose stack set them without effect until now).
sys.sandbox.docker.socket=unix:///var/run/docker.sock
sys.sandbox.docker.workspace.base=/tmp/workspaces
sys.sandbox.provider=none
# URL sandboxes use to call back into this server (blank = derived from the provider's host alias)
sys.sandbox.server.url=
# HMAC secret for the sandbox hub session tokens ("cst_") that let scripts inside a sandbox call
# the session's configured capabilities without holding credentials. Blank = feature disabled.
# Both the server and the sandbox runtime must be restarted with the same value; during a rotation
# the old value keeps verifying until the second one is cleared.
sys.sandbox.sessionToken.secret=
sys.sandbox.sessionToken.secret.previous=
sys.sandbox.snapshot.enabled=false
sys.sandbox.terminal.enabled=false
sys.sandbox.terminal.gatewayUrl=
sys.sandbox.terminal.ticketSecret=
# Sandbox lifetime in seconds; SYS_SANDBOX_TIMEOUT overrides it. Declared here so the env override applies.
sys.sandbox.timeout=3900
# unowned sessions are claimed and run by the instance that received the request (true) or handed to the shared
# Redis stream for any instance to pick up (false, the pre-2026-09 behaviour)
sys.session.claimLocally=true
sys.session.host=local
# session SSE delivery: redis (broadcast) | directed (owner event hub + internal relay)
# directed requires sys.internal.token and a pod registry (rpc=http or lease=postgres)
sys.sse.delivery=redis
# distributed coordination state (session activity, sandbox bindings, A2A task snapshots): redis | postgres
# postgres requires sys.store.mode=pg; command bus and SSE events still use redis
sys.state.backend=redis
# copy legacy mongo spans into postgresql on startup (pg store only); skip keeps them in the archive
sys.store.mode=mongo
sys.trace.span.migration=copy
sys.trace.span.store.mode=auto
