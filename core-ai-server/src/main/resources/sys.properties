# Admin user configuration (only used when no users exist)
# Azure Blob Storage for user file uploads
sys.admin.email=admin@example.com
sys.admin.name=Admin
sys.admin.password=admin
# refresh cadence for long-running tool calls (pending/poll); completion is pushed into the issuing session
sys.asyncTask.pollSeconds=10
sys.gateway.secret.key=change-me
sys.http.listen=8080
sys.https.listen=8443
sys.jedis.host=localhost
sys.jedis.port=6379
sys.log.appender=console
sys.mongo.uri=mongodb://localhost:27017/core-ai
sys.public.url=http://localhost:8080
# Cap for copying a chat attachment into the session's sandbox, in bytes; larger uploads arrive as URLs only
sys.sandbox.attachments.maxBytes=33554432
# docker provider: Docker Engine API endpoint (tcp://host:2375; a unix socket path falls back to localhost:2375) and the
# host directory sandboxes mount as /workspace. Declared here so SYS_SANDBOX_DOCKER_SOCKET / -D overrides apply —
# core-ng only overrides keys that exist in this file (the compose stack set them without effect until now).
sys.sandbox.docker.socket=unix:///var/run/docker.sock
sys.sandbox.docker.workspace.base=/tmp/workspaces
sys.sandbox.provider=none
# URL sandboxes use to call back into this server (blank = derived from the provider's host alias)
sys.sandbox.server.url=
# HMAC secret for the sandbox hub session tokens ("cst_") that let scripts inside a sandbox call
# the session's configured capabilities without holding credentials. Blank = feature disabled.
# Both the server and the sandbox runtime must be restarted with the same value; during a rotation
# the old value keeps verifying until the second one is cleared.
sys.sandbox.sessionToken.secret=
sys.sandbox.sessionToken.secret.previous=
sys.sandbox.snapshot.enabled=false
sys.sandbox.terminal.enabled=false
sys.sandbox.terminal.gatewayUrl=
sys.sandbox.terminal.ticketSecret=
# unowned sessions are claimed and run by the instance that received the request (true) or handed to the shared
# Redis stream for any instance to pick up (false, the pre-2026-09 behaviour)
sys.session.claimLocally=true
sys.session.host=local
