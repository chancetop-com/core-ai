# Admin user configuration (only used when no users exist)
# Azure Blob Storage for user file uploads
sys.admin.email=admin@example.com
sys.admin.name=Admin
sys.admin.password=admin
# refresh cadence for long-running tool calls (pending/poll); completion is pushed into the issuing session
sys.asyncTask.pollSeconds=10
# dataset record store: mongo (core-ng mapping, default) | mongo-native (native driver, data as BSON) | postgresql
# copies mongo datasets/records into postgresql on startup, only when the store is not postgresql
sys.dataset.migration.enabled=false
sys.dataset.mongoNativeCollection=dataset_records_v2
# optional read-only SQL executor (postgresql store only); disabled by default
sys.dataset.sqlExecutor.enabled=false
sys.dataset.sqlExecutor.password=
sys.dataset.sqlExecutor.user=dataset_reader
sys.dataset.store=mongo
# only used when sys.dataset.store=postgresql
sys.db.password=core_ai
sys.db.pool.max=50
sys.db.pool.min=5
sys.db.url=jdbc:postgresql://localhost:5432/core_ai
sys.db.user=core_ai
# Legacy key material for decrypting gateway provider secrets encrypted before the explicit key;
# falls back to sys.mongo.uri when empty.
sys.gateway.legacy.secret=
sys.gateway.secret.key=change-me
# Force HTTP/1.1 for upstream LLM calls to avoid HTTP/2 single-connection upload stalls on high-RTT links; set false to restore HTTP/2 negotiation
sys.gateway.upstream.http1=true
sys.http.listen=8080
sys.https.listen=8443
# Shared secret for pod-to-pod /_internal calls.
# Keep the previous value during a rotation so rolling pods accept both.
sys.internal.token=
sys.internal.token.previous=
sys.log.appender=console
sys.mongo.uri=mongodb://localhost:27017/core-ai
sys.public.url=http://localhost:8080
# conversational dataset reports: enabled only on the postgresql dataset backend
sys.report.enabled=false
# agents.x-k8s.io API version written by every Sandbox writer (chat direct CR and workspace CR):
# v1alpha1 during the controller upgrade window, v1beta1 once the CRD serves it as storage version.
sys.sandbox.agentSandbox.apiVersion=v1alpha1
# Cap for copying a chat attachment into the session's sandbox, in bytes; larger uploads arrive as URLs only
sys.sandbox.attachments.maxBytes=33554432
# docker provider: Docker Engine API endpoint (tcp://host:2375; a unix socket path falls back to localhost:2375) and the
# host directory sandboxes mount as /workspace. Declared here so SYS_SANDBOX_DOCKER_SOCKET / -D overrides apply —
# core-ng only overrides keys that exist in this file (the compose stack set them without effect until now).
sys.sandbox.docker.socket=unix:///var/run/docker.sock
sys.sandbox.docker.workspace.base=/tmp/workspaces
sys.sandbox.provider=none
# URL sandboxes use to call back into this server (blank = derived from the provider's host alias)
sys.sandbox.server.url=
# HMAC secret for the sandbox hub session tokens ("cst_") that let scripts inside a sandbox call
# the session's configured capabilities without holding credentials. Blank = feature disabled.
# Both the server and the sandbox runtime must be restarted with the same value; during a rotation
# the old value keeps verifying until the second one is cleared.
sys.sandbox.sessionToken.secret=
sys.sandbox.sessionToken.secret.previous=
sys.sandbox.snapshot.enabled=false
sys.sandbox.terminal.enabled=false
sys.sandbox.terminal.gatewayUrl=
sys.sandbox.terminal.ticketSecret=
# Sandbox lifetime in seconds; SYS_SANDBOX_TIMEOUT overrides it. Declared here so the env override applies.
sys.sandbox.timeout=3900
# unowned sessions are claimed and run by the instance that received the request (true) or handed to the shared
# command queue for any instance to pick up (false, the pre-2026-09 behaviour)
sys.session.claimLocally=true
sys.session.host=local
# copy legacy mongo spans into postgresql on startup (pg store only); skip keeps them in the archive
sys.store.mode=mongo
# Server-side background tasks (subagents and non-intercepted bash). Sandbox-hosted tools use the
# runtime async-task relay regardless; this flag only controls the server-side BackgroundTaskManager.
sys.tasks.background.enabled=false
sys.tasks.background.maxPerSession=5
sys.tasks.background.outputMaxBytes=1048576
sys.tasks.background.outputRetentionDays=7
# bodies at or below inline.max.bytes stay in PostgreSQL; larger ones are gzipped into object storage
# auto = externalize oversized span/trace bodies when the pg trace store and object storage are available
sys.trace.body.inline.max.bytes=16384
sys.trace.body.offload.enabled=auto
# blank url keeps the main database but still gives trace its own pool; set the url for a dedicated PG
sys.trace.db.conn.budget.fail=false
sys.trace.db.conn.budget.replicas=2
sys.trace.db.conn.budget.reserve=10
sys.trace.db.enabled=true
sys.trace.db.password=
sys.trace.db.pool.max=4
sys.trace.db.pool.min=1
sys.trace.db.schema.check=true
sys.trace.db.timeout.seconds=10
sys.trace.db.url=
sys.trace.db.user=
# bounded hand-off between HTTP/local span producers and the trace store consumer
sys.trace.ingest.handoff.bytes=67108864
# must stay below core-ng HTTP maxEntitySize (10 MB); larger requests are split by the client
sys.trace.ingest.max.record.bytes=9437184
sys.trace.ingest.queue.capacity=10000
sys.trace.ingest.shutdown.timeout.seconds=10
# auto = object storage when the pg trace store and a private object store are available; db keeps Base64
sys.trace.payload.backfill.batch.size=500
sys.trace.payload.backfill.enabled=auto
# blank container reuses the archive/artifact container
sys.trace.payload.container=
sys.trace.payload.storage=auto
sys.trace.span.migration=copy
sys.trace.span.store.mode=auto
# auto follows sys.store.mode; mongo keeps the legacy store, pg uses postgresql
sys.trace.store.mode=auto
# Persistent workspace: off by default until the controller and StorageClass prerequisites are met.
# The volume (PVC) is durable; the runtime (Sandbox CR) is created on wake and deleted on sleep.
sys.workspace.enabled=false
sys.workspace.idleSleepMinutes=15
# blank falls back to WorkspaceDefaults.IMAGE
sys.workspace.image=
sys.workspace.leaseTtlSeconds=600
sys.workspace.leaseWaitSeconds=30
sys.workspace.maxRunningPerUser=2
sys.workspace.maxSizeGb=100
sys.workspace.maxTotalGbPerUser=96
sys.workspace.maxWorkspacesPerUser=3
sys.workspace.minRuntimeSeconds=300
sys.workspace.purgeAfterDays=7
sys.workspace.sizeGb=32
sys.workspace.storageClass=managed-csi
sys.workspace.wakeTimeoutSeconds=180
