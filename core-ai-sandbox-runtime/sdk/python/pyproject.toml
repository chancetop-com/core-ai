[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "core-ai-sandbox"
# Overwritten with core-ai-sandbox-runtime/VERSION during the image build; a source checkout
# reports 0.0.0 and only loses the version in the X-Core-AI-Client header.
version = "0.0.0"
description = "Call this session's agent-configured capabilities from inside a core-ai sandbox"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["core_ai_sandbox*"]
