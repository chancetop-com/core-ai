name: Release Desktop

# Two events can start a desktop release:
#  - a push that bumps core-ai-desktop/VERSION (a desktop-only release, engine pin unchanged)
#  - a successful Release CLI run, but only when the desktop commit pins that exact engine and its
#    own VERSION has not been released yet
# The push path never waits for the engine: when the pinned engine is still being published by the
# CLI workflow of the same commit, the plan step defers to that workflow_run instead of racing it.
# A CLI-only release (desktop VERSION unchanged) or a CLI version the desktop does not pin never
# re-releases the desktop.
#
# Windows = NSIS x64, macOS = dmg/zip arm64 (the CLI's darwin engine is arm64 only); Linux is P2
# (design §4.7). Mac previews use ad-hoc signing until Developer ID signing and notarization are
# configured; Windows previews remain unsigned.

on:
  push:
    branches: [master]
    paths:
      - 'core-ai-desktop/VERSION'
  workflow_run:
    workflows: ["Release CLI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: false
        type: string

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      ref: ${{ steps.plan.outputs.ref }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Checkout the commit being released
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Decide whether this event releases the desktop
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          event="${{ github.event_name }}"
          ref="${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}"
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version=$(cat core-ai-desktop/VERSION); fi
          pin=$(node -p "require('./core-ai-desktop/package.json').coreAi.pinnedEngine")
          cli_version=$(cat core-ai-cli/src/main/resources/VERSION)

          engine_released=false
          if gh release view "v$pin" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then engine_released=true; fi
          desktop_released=false
          if gh release view "desktop-v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then desktop_released=true; fi

          echo "event=$event ref=$ref desktop=$version pinnedEngine=$pin cli=$cli_version engineReleased=$engine_released desktopReleased=$desktop_released"

          build=false
          if [ "$desktop_released" = "true" ]; then
            echo "desktop v$version is already released"
          elif [ "$engine_released" = "true" ]; then
            if [ "$event" = "workflow_run" ] && [ "$cli_version" != "$pin" ]; then
              echo "the CLI that just released is not the engine this desktop pins; nothing to do"
            else
              build=true
            fi
          elif [ "$event" = "push" ] && [ "$cli_version" = "$pin" ]; then
            echo "a CLI release for v$pin is in flight; deferring to its workflow_run"
          else
            echo "::error::pinned engine v$pin is not published and no matching CLI release is pending"
            exit 1
          fi

          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win
            artifacts: |
              core-ai-desktop/release/*.exe
              core-ai-desktop/release/latest.yml
          - os: macos-latest
            target: mac
            artifacts: |
              core-ai-desktop/release/*.dmg
              core-ai-desktop/release/*.zip
              core-ai-desktop/release/latest-mac.yml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: core-ai-desktop/package-lock.json

      - name: Install dependencies
        working-directory: core-ai-desktop
        run: npm ci

      - name: Run desktop checks
        working-directory: core-ai-desktop
        run: |
          npm test
          npm run check

      - name: Stage the pinned engine
        working-directory: core-ai-desktop
        run: npm run stage:engine

      - name: Package
        working-directory: core-ai-desktop
        run: npm run dist

      - name: Verify macOS package
        if: matrix.target == 'mac'
        working-directory: core-ai-desktop
        run: npm run verify:mac

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: core-ai-desktop-${{ matrix.target }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    needs: [plan, build]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: core-ai-desktop-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ needs.plan.outputs.version }}
          name: core-ai desktop v${{ needs.plan.outputs.version }}
          target_commitish: ${{ needs.plan.outputs.ref }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          # The repo's "latest" slot belongs to the CLI (README install URLs and update checks resolve
          # through it) — same rule as the sandbox runtime release.
          make_latest: 'false'
          # Flip to false once signing/notarization ships (P0b, design §4.7).
          prerelease: true
