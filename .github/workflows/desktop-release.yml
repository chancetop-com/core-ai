name: Release Desktop

# Mirrors cli-release.yml: bump core-ai-desktop/VERSION to release. The desktop app ships the pinned
# engine (package.json coreAi.pinnedEngine) downloaded from the matching CLI release, so the engine
# version must be published first. Windows = NSIS x64, macOS = dmg/zip arm64 (the CLI's darwin engine
# is arm64 only); Linux is P2 (design §4.7). Mac previews use ad-hoc signing until Developer ID
# signing and notarization are configured; Windows previews remain unsigned.

on:
  push:
    branches: [master]
    paths:
      - 'core-ai-desktop/VERSION'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: false
        type: string

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: win
            artifacts: |
              core-ai-desktop/release/*.exe
              core-ai-desktop/release/latest.yml
          - os: macos-latest
            target: mac
            artifacts: |
              core-ai-desktop/release/*.dmg
              core-ai-desktop/release/*.zip
              core-ai-desktop/release/latest-mac.yml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: core-ai-desktop/package-lock.json

      - name: Install dependencies
        working-directory: core-ai-desktop
        run: npm ci

      - name: Run desktop checks
        working-directory: core-ai-desktop
        run: |
          npm test
          npm run check

      - name: Wait for the pinned engine release
        # The engine pin can be newer than the last CLI release when both modules ride one push
        # (the CLI release workflow builds first); poll instead of failing on a transient 404.
        working-directory: core-ai-desktop
        shell: bash
        run: |
          version=$(node -p "require('./package.json').coreAi.pinnedEngine")
          asset=core-ai-cli-windows.exe
          if [ "${{ matrix.target }}" = "mac" ]; then asset=core-ai-cli-darwin; fi
          url="https://github.com/chancetop-com/core-ai/releases/download/v${version}/${asset}"
          for attempt in $(seq 1 40); do
            if curl -fsIL "$url" -o /dev/null; then
              echo "engine release is available: $url"
              exit 0
            fi
            echo "attempt ${attempt}: v${version} engine is not published yet, waiting 30s"
            sleep 30
          done
          echo "::error::engine release v${version} is not available after 20 minutes"
          exit 1

      - name: Stage the pinned engine
        working-directory: core-ai-desktop
        run: npm run stage:engine

      - name: Package
        working-directory: core-ai-desktop
        run: npm run dist

      - name: Verify macOS package
        if: matrix.target == 'mac'
        working-directory: core-ai-desktop
        run: npm run verify:mac

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: core-ai-desktop-${{ matrix.target }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "value=$(cat core-ai-desktop/VERSION)" >> $GITHUB_OUTPUT
          fi

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: core-ai-desktop-*
          merge-multiple: true
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.version.outputs.value }}
          name: core-ai desktop v${{ steps.version.outputs.value }}
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          # The repo's "latest" slot belongs to the CLI (README install URLs and update checks resolve
          # through it) — same rule as the sandbox runtime release.
          make_latest: 'false'
          # Flip to false once signing/notarization ships (P0b, design §4.7).
          prerelease: true
