name: Secret Scan

# Scans the commits a push or pull request introduces rather than the whole history: old commits
# still carry findings (test fixtures, documentation examples, and credentials that were later
# replaced with ***), and a full-history scan would fail on every run because of them. Running the
# workflow manually scans the whole history instead.

on:
  pull_request:
    branches: [master]
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request)
              LOG_OPTS="${BASE_SHA}..${HEAD_SHA}"
              ;;
            push)
              if [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
                LOG_OPTS="${BEFORE_SHA}..${AFTER_SHA}"
              else
                # new branch or force push: the previous tip is gone, so the pushed tip is all that is left to scan
                LOG_OPTS="${AFTER_SHA} -1"
              fi
              ;;
            *)
              # manual run: no commit range to derive, scan everything, including the known historical findings
              LOG_OPTS=""
              ;;
          esac
          echo "scanning commits: ${LOG_OPTS:---all}"
          if [ -n "$LOG_OPTS" ]; then
            gitleaks git . --log-opts="$LOG_OPTS" --redact --verbose --no-banner
          else
            gitleaks git . --redact --verbose --no-banner
          fi
